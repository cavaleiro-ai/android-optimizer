schema_version: "1.1"
name: camera-scan-before-changes
expected_outcome: |
  O agente segue o guia de câmera: pergunta o que mais incomoda e até onde ir (só apps, recursos ocultos ou sistema),
  planeja uma varredura só de leitura e uma medição antes de qualquer mudança, e não promete qualidade que o hardware
  talvez não entregue.
